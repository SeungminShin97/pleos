name: Android build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build, test and lint both variants
        run: >-
          ./gradlew
          :app:assembleDemoDebug :app:assembleVehicleDebug
          :app:testDemoDebugUnitTest :app:testVehicleDebugUnitTest
          :app:lintDemoDebug :app:lintVehicleDebug
          --stacktrace
      - name: Upload debug APKs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-build
          retention-days: 14
          path: |
            app/build/outputs/apk/*/debug/*.apk
            app/build/reports/
            app/build/test-results/
